[project]
name = "pygc"
version = "0.1.0"
description = "Git-centric library, CLI, and web interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
gc = "pygc.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/pygc/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/pygc"]

[tool.hatch.build.targets.wheel.force-include]
"src/pygc/static" = "pygc/static"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
